name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build (iOS app + widgets + Apple Watch)
        run: |
          xcodebuild -project NamazVakti.xcodeproj -scheme NamazVakti \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO build > build.log 2>&1 && echo "BUILD OK" || \
          (grep -E "error:|Error:" build.log | sort -u | head -100; tail -30 build.log; exit 1)

      - name: Summary (targets and warnings)
        if: always()
        run: |
          echo "== Targets built =="
          grep -oE "\(in target '[A-Za-z]+' from project 'NamazVakti'\)" build.log | sort | uniq -c || true
          echo "== Warnings in our code =="
          grep -E "warning:" build.log | grep -E "/(App|Shared|Widgets|Watch|WatchWidgets)/" | sed -E 's#.*/(App|Shared|Widgets|Watch|WatchWidgets)/#\1/#' | sort -u | head -80 || true
          echo "== Other warnings =="
          grep -E "warning:" build.log | grep -vE "/(App|Shared|Widgets|Watch|WatchWidgets)/|SourcePackages" | sort -u | head -30 || true

      - name: Tests and screenshots (iPhone simulator)
        if: success()
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for r,l in d.items() if 'iOS' in r for x in l if x['name'].startswith('iPhone') and 'Pro' in x['name']))")
          echo "Simulator: $UDID"
          xcodebuild test -project NamazVakti.xcodeproj -scheme NamazVakti \
            -destination "id=$UDID" -resultBundlePath Results.xcresult \
            -skipPackagePluginValidation -skipMacroValidation CODE_SIGNING_ALLOWED=NO > test.log 2>&1 && echo "TESTS OK" || \
            (grep -E "error:|failed|Fail|XCTAssert" test.log | sort -u | head -60; echo "TESTS FAILED")
          grep -E "Test Case .* (passed|failed)" test.log | sed -E 's/.*Test Case//' | head -40 || true
          mkdir -p shots raw
          xcrun xcresulttool export attachments --path Results.xcresult --output-path raw || true
          python3 - <<'PY'
          import json, os, shutil
          try:
              m = json.load(open('raw/manifest.json'))
          except Exception as e:
              print('no manifest', e); m = []
          for test in m:
              for a in test.get('attachments', []):
                  name = a.get('suggestedHumanReadableName') or a['exportedFileName']
                  name = name.split('_0_')[0] if '_0_' in name else name
                  if not name.endswith('.png'): name += '.png'
                  shutil.copy(os.path.join('raw', a['exportedFileName']), os.path.join('shots', name))
          print('screenshots:', len(os.listdir('shots')))
          PY

      - name: Publish screenshots to branch ci-screens
        if: success()
        run: |
          cd shots
          git init -q -b ci-screens
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          cp ../test.log . 2>/dev/null || true
          git add -A && git commit -qm "Screenshots ${GITHUB_SHA::7}" || exit 0
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-screens

      - name: Commit generated Xcode project
        if: success() && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -f NamazVakti.xcodeproj
          if ! git diff --cached --quiet; then
            git commit -m "Xcode projesini güncelle [skip ci]"
            git push
          fi
