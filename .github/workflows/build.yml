name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build (iOS app + widgets + Apple Watch)
        run: |
          xcodebuild -project NamazVakti.xcodeproj -scheme NamazVakti \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO build > build.log 2>&1 && echo "BUILD OK" || \
          (grep -E "error:|Error:" build.log | sort -u | head -100; tail -30 build.log; exit 1)

      - name: Summary (targets and warnings)
        if: always()
        run: |
          echo "== Targets built =="
          grep -oE "\(in target '[A-Za-z]+' from project 'NamazVakti'\)" build.log | sort | uniq -c || true
          echo "== Warnings in our code =="
          grep -E "warning:" build.log | grep -E "/(App|Shared|Widgets|Watch|WatchWidgets)/" | sed -E 's#.*/(App|Shared|Widgets|Watch|WatchWidgets)/#\1/#' | sort -u | head -80 || true
          echo "== Other warnings =="
          grep -E "warning:" build.log | grep -vE "/(App|Shared|Widgets|Watch|WatchWidgets)/|SourcePackages" | sort -u | head -30 || true

      - name: Commit generated Xcode project
        if: success() && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -f NamazVakti.xcodeproj
          if ! git diff --cached --quiet; then
            git commit -m "Xcode projesini güncelle [skip ci]"
            git push
          fi
